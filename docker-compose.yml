services:
  # ============================================
  # Infrastructure
  # ============================================

  redis:
    image: redis:7-alpine
    container_name: hivemind-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hivemind-network

  postgres:
    image: postgres:16-alpine
    container_name: hivemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hivemind}
      POSTGRES_USER: ${POSTGRES_USER:-hivemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hivemind-network

  # ============================================
  # Hivemind Rust Services
  # ============================================

  nodepool:
    build:
      context: .
      dockerfile: hivemind-rs/Dockerfile
    container_name: hivemind-nodepool
    command: ["/app/hivemind-bin", "nodepool"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-hivemind}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-hivemind}"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a non-default value}
      WORKER_EXECUTION_PRIVATE_KEY_PEM: ${WORKER_EXECUTION_PRIVATE_KEY_PEM:?WORKER_EXECUTION_PRIVATE_KEY_PEM must be set for nodepool execution-token signing}
      NODEPOOL_GRPC_ADDR: 0.0.0.0:50051
      TORRENT_API_DIR: /app/api/torrents
      TORRENT_BT_DIR: /app/bt_torrents
      TORRENT_ANNOUNCE_URL: ${HIVEMIND_TORRENT_ANNOUNCE_URL:-http://nodepool:6969/announce}
      TORRENT_SEED_LISTEN_ADDR: ${TORRENT_SEED_LISTEN_ADDR:-0.0.0.0:6881}
      TORRENT_SEED_ADVERTISE_ADDR: ${TORRENT_SEED_ADVERTISE_ADDR:-172.28.0.10:6881}
      TORRENT_ALLOW_LOCAL_TASK_ARTIFACTS: "false"
      # Settlement policy belongs to the nodepool: it owns the dispatcher that
      # decides whether a managed task settles from a verified claim. Setting it
      # on the worker has no effect.
      MANAGED_PROOF_ROLLOUT_MODE: ${MANAGED_PROOF_ROLLOUT_MODE:-enforce}
      # Nodepool authorizes every /api/admin/* call, so without this the admin
      # surface is unreachable in a Compose deployment. Empty means no admins,
      # which is the safe default.
      HIVEMIND_ADMIN_USERS: ${HIVEMIND_ADMIN_USERS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${NODEPOOL_GRPC_HOST_PORT:-50051}:50051"  # gRPC (nodepool)
      - "${TORRENT_TRACKER_HOST_PORT:-6969}:6969"  # BitTorrent tracker announce
      - "${TORRENT_SEED_HOST_PORT:-6881}:6881"     # BitTorrent task seeder
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      hivemind-network:
        ipv4_address: 172.28.0.10
    volumes:
      - hivemind-data:/app/data
      - nodepool-torrents:/app/bt_torrents
      - nodepool-task-packages:/app/api/torrents

  master:
    build:
      context: .
      dockerfile: hivemind-rs/Dockerfile
    container_name: hivemind-master
    command: ["/app/hivemind-bin", "master"]
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a non-default value}
      NODEPOOL_GRPC_ENDPOINT: nodepool:50051
      MASTER_HTTP_ADDR: 0.0.0.0:8082
      MASTER_CORS_ALLOWED_ORIGINS: ${MASTER_CORS_ALLOWED_ORIGINS:-}
      TORRENT_API_DIR: /app/api/torrents
      TORRENT_BT_DIR: /app/bt_torrents
      TORRENT_ANNOUNCE_URL: ${HIVEMIND_TORRENT_ANNOUNCE_URL:-http://nodepool:6969/announce}
      TORRENT_ALLOW_LOCAL_TASK_ARTIFACTS: "false"
      TORRENT_TASK_ARTIFACT_BASE_URL: ${TORRENT_TASK_ARTIFACT_BASE_URL:-http://master:8082/task-artifacts}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${MASTER_HTTP_HOST_PORT:-8082}:8082"  # HTTP API (master)
    depends_on:
      - nodepool
    networks:
      - hivemind-network
    volumes:
      - master-task-references:/app/api/torrents
      - master-torrents:/app/bt_torrents

  worker:
    build:
      context: .
      dockerfile: hivemind-rs/Dockerfile
    container_name: hivemind-worker
    command: ["/app/hivemind-bin", "worker"]
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a non-default value}
      NODEPOOL_GRPC_ENDPOINT: nodepool:50051
      WORKER_NODEPOOL_TOKEN: ${WORKER_NODEPOOL_TOKEN:-}
      WORKER_EXECUTION_PUBLIC_KEY_PEM: ${WORKER_EXECUTION_PUBLIC_KEY_PEM:?WORKER_EXECUTION_PUBLIC_KEY_PEM must be set for worker execution-token verification}
      WORKER_GRPC_ADDR: 0.0.0.0:50053
      WORKER_ADVERTISE_ADDR: worker:50053
      WORKER_CONTROL_HTTP_ADDR: 0.0.0.0:18080
      WORKER_CONTROL_CORS_ALLOWED_ORIGINS: ${WORKER_CONTROL_CORS_ALLOWED_ORIGINS:-}
      TORRENT_API_DIR: /app/api/torrents
      TORRENT_BT_DIR: /app/bt_torrents
      TORRENT_ANNOUNCE_URL: ${HIVEMIND_TORRENT_ANNOUNCE_URL:-http://nodepool:6969/announce}
      MONTY_EXECUTABLE: /app/monty
      # Proving happens on the worker; the settlement policy that consumes the
      # resulting proof is configured on the nodepool.
      MANAGED_PROVER_EXECUTABLE: ${MANAGED_PROVER_EXECUTABLE:-/app/prover/hivemind-managed-proof-prover}
      MANAGED_PROVER_TIMEOUT_SECS: ${MANAGED_PROVER_TIMEOUT_SECS:-900}
      EXECUTOR_SANDBOX_DIR: /app/sandbox
      EXECUTOR_NETWORK_EGRESS_ENABLED: ${EXECUTOR_NETWORK_EGRESS_ENABLED:-true}
      EXECUTOR_NETWORK_EGRESS_MODE: ${EXECUTOR_NETWORK_EGRESS_MODE:-allowlist}
      EXECUTOR_NETWORK_EGRESS_TARGETS: ${EXECUTOR_NETWORK_EGRESS_TARGETS:-172.28.0.0/24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${WORKER_GRPC_HOST_PORT:-50053}:50053"        # gRPC (worker)
      - "${WORKER_CONTROL_HOST_PORT:-18080}:18080"     # HTTP API (local worker control)
    depends_on:
      - nodepool
    networks:
      - hivemind-network
    volumes:
      - worker-task-downloads:/app/api/torrents
      - worker-torrents:/app/bt_torrents

  # ============================================
  # Frontend (optional)
  # ============================================

  master-ui:
    build:
      context: ./frontend/master-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8082}
    container_name: hivemind-master-ui
    restart: unless-stopped
    ports:
      - "${MASTER_UI_HOST_PORT:-3000}:80"
    depends_on:
      - master
    networks:
      - hivemind-network

  worker-ui:
    build:
      context: ./frontend/worker-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8082}
        VITE_WORKER_CONTROL_BASE: ${VITE_WORKER_CONTROL_BASE:-http://localhost:18080}
    container_name: hivemind-worker-ui
    restart: unless-stopped
    ports:
      - "${WORKER_UI_HOST_PORT:-3001}:80"
    depends_on:
      - worker
    networks:
      - hivemind-network

  site:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hivemind-site
    restart: unless-stopped
    environment:
      WEBSITE_NODEPOOL_GRPC_ADDR: ${WEBSITE_NODEPOOL_GRPC_ADDR:-nodepool:50051}
    ports:
      - "${SITE_HOST_PORT:-8080}:3000"
    depends_on:
      - nodepool
    networks:
      - hivemind-network

# ============================================
# Networks
# ============================================

networks:
  hivemind-network:
    driver: bridge
    name: hivemind-network
    ipam:
      config:
        - subnet: 172.28.0.0/24

# ============================================
# Volumes
# ============================================

volumes:
  redis-data:
    name: ${REDIS_VOLUME_NAME:-hivemind-redis-data}
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-hivemind-postgres-data}
  hivemind-data:
    name: ${HIVEMIND_DATA_VOLUME_NAME:-hivemind-data}
  nodepool-torrents:
    name: ${NODEPOOL_TORRENTS_VOLUME_NAME:-hivemind-nodepool-torrents}
  nodepool-task-packages:
    name: ${NODEPOOL_TASK_PACKAGES_VOLUME_NAME:-hivemind-nodepool-task-packages}
  master-task-references:
    name: ${MASTER_TASK_REFERENCES_VOLUME_NAME:-hivemind-master-task-references}
  master-torrents:
    name: ${MASTER_TORRENTS_VOLUME_NAME:-hivemind-master-torrents}
  worker-task-downloads:
    name: ${WORKER_TASK_DOWNLOADS_VOLUME_NAME:-hivemind-worker-task-downloads}
  worker-torrents:
    name: ${WORKER_TORRENTS_VOLUME_NAME:-hivemind-worker-torrents}
