[workspace]
resolver = "2"
members = ["crates/managed-function-runtime"]
default-members = ["crates/managed-function-runtime"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.90"
license = "MIT"
authors = ["Hivemind Team"]
description = "Deterministic, metered managed-function runtime for Hivemind."
categories = ["emulators", "development-tools"]
keywords = ["hivemind", "runtime", "deterministic", "metering"]
homepage = "https://github.com/him6794/hivemind"
repository = "https://github.com/him6794/hivemind"
documentation = "https://github.com/him6794/hivemind"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = false

[workspace.lints.rust]
# codspeed cfg is set by codspeed-criterion-compat when running in CodSpeed environment
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(codspeed)'] }

[workspace.lints.clippy]
dbg_macro = "warn"
use_self = "warn"
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"

# in general we lint against the pedantic group, but we will whitelist
# certain lints which we don't want to enforce
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
doc_markdown = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
