[package]
name = "hivemind-task-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
tonic.workspace = true
serde.workspace = true
serde_json.workspace = true
prost.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
sha1.workspace = true
jsonwebtoken.workspace = true
sqlx.workspace = true
hivemind-proto = { path = "../proto" }
hivemind-models = { path = "../models" }
hivemind-database = { path = "../database" }
hivemind-config = { path = "../config" }
hivemind-auth = { path = "../auth" }
hivemind-managed-proof = { path = "../managed-proof" }
general-compute-runtime = { path = "../../../executor-rs/crates/general-compute-runtime" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio-stream.workspace = true
