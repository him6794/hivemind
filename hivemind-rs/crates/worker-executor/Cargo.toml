[package]
name = "hivemind-worker-executor"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Operator-owned CUDA support for hcode-gpu only. The managed
# runtimes use their typed result channels independently of this feature.
cuda = ["managed-function-runtime/cuda"]

[dependencies]
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
prost.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
sysinfo.workspace = true
sha2.workspace = true
pollster = "0.4"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan"] }
hivemind-proto = { path = "../proto" }
hivemind-models = { path = "../models" }
hivemind-config = { path = "../config" }
hivemind-client-runtime = { path = "../client-runtime" }
hivemind-managed-consensus = { path = "../managed-consensus" }
hivemind-auth = { path = "../auth" }
managed-function-runtime = { path = "../../../executor-rs/crates/managed-function-runtime" }
general-compute-runtime = { path = "../../../executor-rs/crates/general-compute-runtime" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonwebtoken.workspace = true
tempfile.workspace = true
tower.workspace = true
