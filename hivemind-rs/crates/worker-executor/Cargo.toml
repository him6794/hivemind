[package]
name = "hivemind-worker-executor"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Operator-owned CUDA support for managed-function-gpu-v1 only. The managed
# runtimes use their typed result channels independently of this feature.
cuda = ["managed-function-runtime/cuda"]

[dependencies]
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
prost.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
sysinfo.workspace = true
hivemind-proto = { path = "../proto" }
hivemind-models = { path = "../models" }
hivemind-config = { path = "../config" }
hivemind-client-runtime = { path = "../client-runtime" }
hivemind-managed-consensus = { path = "../managed-consensus" }
hivemind-auth = { path = "../auth" }
managed-function-runtime = { path = "../../../executor-rs/crates/managed-function-runtime" }
general-compute-runtime = { path = "../../../executor-rs/crates/general-compute-runtime" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
jsonwebtoken.workspace = true
tempfile.workspace = true
tower.workspace = true
