[package]
name = "hivemind-managed-proof"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
risc0-verifier = ["dep:hivemind-proto", "dep:risc0-zkvm"]

[dependencies]
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
serde_json.workspace = true
hivemind-proto = { path = "../proto", optional = true }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["disable-dev-mode"], optional = true }

[[test]]
name = "v0_semantics_manifest"
path = "tests/v0_semantics_manifest.rs"
required-features = ["risc0-verifier"]
