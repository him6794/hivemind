syntax = "proto3";

package nodepool;

option go_package = "./pb";

// ============================================================
// Auth & User
// ============================================================

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    bool success = 1;
    string status_message = 2;
    string token = 3;
}

message RegisterUserRequest {
    string username = 1;
    string password = 2;
    string email = 3;
}

message RegisterUserResponse {
    bool success = 1;
    string status_message = 2;
}

message GetBalanceRequest {
    string username = 1;
    string token = 2;
}

message GetBalanceResponse {
    bool success = 1;
    string status_message = 2;
    int64 balance = 3;
}

message TransferCptRequest {
    string token = 1;
    string to_username = 2;
    int64 amount_cpt = 3;
    string idempotency_key = 4;
}

message TransferCptResponse {
    bool success = 1;
    string status_message = 2;
    int64 from_balance = 3;
    int64 to_balance = 4;
    string transfer_id = 5;
}

message VerifyEmailRequest {
    string verification_token = 1;
}

message VerifyEmailResponse {
    bool success = 1;
    string status_message = 2;
    // "granted", "pool_empty" (the system pool is below the grant), or "already_granted".
    string welcome_grant_status = 3;
}

message ResendVerificationRequest {
    string token = 1;
}

message ResendVerificationResponse {
    bool success = 1;
    string status_message = 2;
}

// Adds an address only when the account has none or its unverified reservation expired.
message BindEmailRequest {
    string token = 1;
    string current_password = 2;
    string email = 3;
}

message BindEmailResponse {
    bool success = 1;
    string status_message = 2;
}

message GetAccountRequest {
    string token = 1;
}

message GetAccountResponse {
    bool success = 1;
    string status_message = 2;
    string username = 3;
    string email = 4;
    bool email_verified = 5;
    int64 balance = 6;
    string welcome_grant_status = 7;
}

message ChangePasswordRequest {
    string token = 1;
    string current_password = 2;
    string new_password = 3;
}

message ChangePasswordResponse {
    bool success = 1;
    string status_message = 2;
}

message RequestPasswordResetRequest {
    string email = 1;
}

message ResetPasswordRequest {
    string reset_token = 1;
    string new_password = 2;
}

message ResetPasswordResponse {
    bool success = 1;
    string status_message = 2;
}

message RequestUsernameReminderRequest {
    string email = 1;
}

// Accepted means the request was processed. The response never reveals whether an account exists.
message AccountRequestResponse {
    bool success = 1;
    string status_message = 2;
}

message RefreshTokenRequest {
    string old_token = 1;
}
message RefreshTokenResponse {
    bool success = 1;
    string status_message = 2;
    string new_token = 3;
}
// Ends the sign-in session the token belongs to. The token stops working at once.
message LogoutRequest {
    string token = 1;
}
message LogoutResponse {
    bool success = 1;
    string status_message = 2;
}
// Whether the address has verified ownership or an unexpired unverified reservation.
message CheckEmailRequest {
    string email = 1;
}
message CheckEmailResponse {
    bool success = 1;
    string status_message = 2;
    bool available = 3;
    bool verified = 4;
}

// Short-lived, single-use enrollment handoff issued by Nodepool after an
// authenticated Website login. The credential is opaque to clients and its
// raw value must remain in memory only until redemption.
message IssueEnrollmentCredentialRequest {
    string token = 1;
    string role = 2;
    string client_instance_id = 3;
}

message IssueEnrollmentCredentialResponse {
    bool success = 1;
    string status_message = 2;
    string credential = 3;
    string credential_id = 4;
    string owner = 5;
    string role = 6;
    int64 expires_at_unix = 7;
}

message RedeemEnrollmentCredentialRequest {
    string credential = 1;
}

message RedeemEnrollmentCredentialResponse {
    bool success = 1;
    string status_message = 2;
    string credential_id = 3;
    string identity_id = 4;
    string owner = 5;
    string role = 6;
    string client_instance_id = 7;
    string worker_id = 8;
    int64 expires_at_unix = 9;
}

// ============================================================
// Resource Model: CPU / GPU / RAM / VRAM / Storage
// ============================================================

message ResourceSpec {
    int32 cpu_cores = 1;
    int64 memory_mb = 2;        // RAM in MB
    int32 gpu_count = 3;
    string gpu_name = 4;
    int64 vram_mb = 5;          // VRAM in MB
    int32 cpu_score = 6;
    int32 gpu_score = 7;
    int64 storage_total_gb = 8;
    int64 storage_available_gb = 9;
    optional string score_suite = 10;
}

message ResourceUsage {
    float cpu_percent = 1;
    float memory_percent = 2;
    float gpu_percent = 3;
    float vram_percent = 4;
    float storage_percent = 5;
}

// Typed contract JSON is validated against the shared strict Rust models.
message HardwareBenchmarkReport {
    uint32 protocol_version = 1;
    string report_json = 2;
}

message ResourceObservation {
    uint32 protocol_version = 1;
    string observation_json = 2;
}

message ExecutionObservation {
    uint32 protocol_version = 1;
    string observation_json = 2;
}

// Bounded public capability/readiness observation. The JSON payload is a
// canonical, versioned list validated by Nodepool; it is never an operator
// trust list or a typed hardware attestation.
message WorkerCapabilityReport {
    uint32 protocol_version = 1;
    string capabilities_json = 2;
    bool ready = 3;
    string readiness_reason = 4;
}

// ============================================================
// Worker Registration & Status
// ============================================================

message RegisterWorkerNodeRequest {
    string username = 1;
    string ip = 2;
    ResourceSpec resources = 3;
    string location = 4;
    string worker_id = 5;
    string token = 6;
    WorkerCapabilityReport capability_report = 7;
    HardwareBenchmarkReport benchmark_report = 8;
    ResourceObservation resource_observation = 9;
}

message StatusResponse {
    bool success = 1;
    string status_message = 2;
    optional int32 effective_cpu_threads = 3;
    uint64 worker_policy_generation = 4;
}

message RunningStatusRequest {
    string username = 1;
    string status = 2;
    ResourceUsage usage = 3;
    string token = 4;
    string worker_id = 5;
    WorkerCapabilityReport capability_report = 6;
    HardwareBenchmarkReport benchmark_report = 7;
    ResourceObservation resource_observation = 8;
}

message RunningStatusResponse {
    bool success = 1;
    string status_message = 2;
    optional int32 effective_cpu_threads = 3;
    uint64 worker_policy_generation = 4;
}

// Worker -> Nodepool: authoritative validation of one immutable
// general-compute transfer lease identity. Workers must not treat their local
// CAS/report state as revocation authority after a task is reassigned.
message ValidateGeneralComputeTransferLeaseRequest {
    string token = 1; // Nodepool-issued Ed25519 worker-execution token
    string worker_id = 2;
    string task_id = 3;
    string execution_id = 4;
    string attempt_id = 5;
    int64 transfer_generation = 6;
    string idempotency_key = 7;
    string request_digest = 8;
}

message ValidateGeneralComputeTransferLeaseResponse {
    bool success = 1;
    string status_message = 2;
}


message UploadTaskRequest {
    string task_id = 1;
    string torrent = 2;        // BT info-hash or magnet URI
    ResourceSpec requirements = 3;
    string location = 4;
    int32 host_count = 5;
    string token = 6;
    int64 max_cpt = 7;
    string runtime = 8;
    string task_source = 9;
    // Deprecated/ rejected: task package bytes remain on the master seeder.
    // Nodepool stores only the torrent/magnet reference in the task record.
    bytes package_data = 10;
    string package_filename = 11;
    bytes general_compute_manifest_json = 12; // canonical general-compute-v1alpha1 request manifest
    string managed_dsl_backend_id = 13;
    string managed_dsl_semantics_manifest_sha256 = 14;
    bytes managed_gpu_manifest_json = 15; // canonical hcode-gpu request manifest
    uint32 managed_consensus_version = 16;
    uint32 managed_replica_count = 17;
    uint32 managed_quorum = 18;
}

message UploadTaskResponse {
    bool success = 1;
    string status_message = 2;
}

message GetAllUserTasksRequest {
    string token = 1;
    // Empty returns the latest 100 tasks. Otherwise returns only these owned IDs (max 100).
    repeated string task_ids = 2;
}

message GetAllUserTasksResponse {
    repeated TaskInfo tasks = 1;
}

message TaskInfo {
    string task_id = 1;
    string owner = 2;
    string status = 3;
    string status_message = 4;
    string worker_ip = 5;
    string output = 6;
    string result_torrent = 7;
    int64 billed_amount = 8;
    bool billing_settled = 9;
    int32 retry_count = 10;
    int64 wall_time_ms = 11;
    int64 peak_memory_mb = 12;
    double cpu_usage = 13;
    double memory_usage = 14;
    double gpu_usage = 15;
    double gpu_memory_usage = 16;
    bool deterministic = 17;
    string worker_id = 18;
    string provider_user = 19;
    string dispatch_status = 20;
    int64 usage_units = 21;
    int64 max_cpt = 22;
    string runtime = 23;
    ManagedConsensusSummary managed_consensus = 25;
    ExecutionObservation execution_observation = 26;
    string performance_suite = 27;
}


message ListWorkersRequest {
    bool include_offline = 1;
    string token = 2;
}

message WorkerInfo {
    string worker_id = 1;
    string username = 2;
    string ip = 3;
    string status = 4;
    int32 cpu_cores = 5;
    int32 memory_gb = 6;
    int32 cpu_score = 7;
    int32 gpu_score = 8;
    int32 gpu_memory_gb = 9;
    string gpu_name = 10;
    int64 vram_mb = 11;
    int64 storage_total_gb = 12;
    int64 storage_available_gb = 13;
    bool provider_enabled = 14;
    int32 cpu_cores_limit = 15;
    int32 memory_gb_limit = 16;
    int32 gpu_memory_gb_limit = 17;
    int64 storage_gb_limit = 18;
    int64 min_cpt_per_hour = 19;
    string location = 20;
    double cpu_usage = 21;
    double memory_usage = 22;
    double gpu_usage = 23;
    double gpu_memory_usage = 24;
    HardwareBenchmarkReport benchmark_report = 25;
    ResourceObservation resource_observation = 26;
    optional int32 effective_cpu_threads = 27;
    uint64 worker_policy_generation = 28;
}

message ListWorkersResponse {
    bool success = 1;
    string status_message = 2;
    repeated WorkerInfo workers = 3;
}

message RemoveWorkerRequest {
    string worker_id = 1;
    string token = 2;
}

message QuoteTaskRequest {
    string token = 1;
    int32 cpu_score = 2;
    int32 gpu_score = 3;
    int32 memory_gb = 4;
    int32 gpu_memory_gb = 5;
    int64 storage_gb = 6;
    int32 host_count = 7;
    string score_suite = 8;
}

message PricingBreakdown {
    int64 base = 1;
    int64 cpu = 2;
    int64 gpu = 3;
    int64 memory = 4;
    int64 gpu_memory = 5;
    int64 storage = 6;
    int64 host_count = 7;
    int64 per_host_total = 8;
    int64 total = 9;
}

message QuoteTaskResponse {
    bool success = 1;
    int64 quoted_cpt = 2;
    string currency = 3;
    PricingBreakdown breakdown = 4;
    string score_suite = 5;
}

message GetProviderEarningsRequest {
    string token = 1;
    int64 limit = 2;
}

message ProviderEarningsEntry {
    string task_id = 1;
    string payer_user = 2;
    string provider_worker_id = 3;
    int64 amount_cpt = 4;
    string status = 5;
    string created_at = 6;
}

message GetProviderEarningsResponse {
    bool success = 1;
    string status_message = 2;
    int64 total_earned_cpt = 3;
    string currency = 4;
    repeated ProviderEarningsEntry entries = 5;
}

// Narrow owner-authenticated view of one registered Worker's active tasks.
// Source, result, and task log payloads are intentionally excluded.
message GetProviderWorkerAssignmentsRequest {
    string token = 1;
    string worker_id = 2;
}

message ProviderWorkerAssignment {
    string task_id = 1;
    string submitter = 2;
    string status = 3;
    int64 max_cpt = 4;
    // Worker-reported CPT claim for observation only; settlement validates it separately.
    optional int64 reported_usage_cpt = 5;
    string usage_basis = 6;
    optional string usage_updated_at = 7;
}

message GetProviderWorkerAssignmentsResponse {
    bool success = 1;
    string status_message = 2;
    string worker_id = 3;
    repeated ProviderWorkerAssignment assignments = 4;
}

message GetProviderWorkerSettingsRequest {
    string token = 1;
    string worker_id = 2;
}

message ProviderWorkerSettings {
    bool enabled = 1;
    int32 cpu_cores_limit = 2;
    int32 memory_gb_limit = 3;
    int32 gpu_memory_gb_limit = 4;
    int64 storage_gb_limit = 5;
    int64 min_cpt_per_hour = 6;
}

message GetProviderWorkerSettingsResponse {
    bool success = 1;
    string message = 2;
    string worker_id = 3;
    ProviderWorkerSettings settings = 4;
}

message UpdateProviderWorkerSettingsRequest {
    string token = 1;
    string worker_id = 2;
    ProviderWorkerSettings settings = 3;
}

message UpdateProviderWorkerSettingsResponse {
    bool success = 1;
    string message = 2;
    string worker_id = 3;
    ProviderWorkerSettings settings = 4;
}
message GetTaskResultRequest {
    string task_id = 1;
    string token = 2;
}

message GetTaskResultResponse {
    bool success = 1;
    string status_message = 2;
    string result_torrent = 3;
    bytes managed_gpu_result_json = 4; // Nodepool-validated hcode-gpu result
    ManagedConsensusSummary managed_consensus = 5;
}

message StopTaskRequest {
    string task_id = 1;
    string token = 2;
}

message StopTaskResponse {
    bool success = 1;
    string status_message = 2;
}

message TasklogRequest {
    string task_id = 1;
    string token = 2;
}

message TasklogResponse {
    bool success = 1;
    string log = 2;
}

message DownloadTaskArtifactRequest {
    string task_id = 1;
    string token = 2;
    string artifact_key = 3;
}

message DownloadTaskArtifactResponse {
    bool success = 1;
    string status_message = 2;
    string filename = 3;
    string content_type = 4;
    bytes data = 5;
}

// ============================================================
// Nodepool �� Worker: Task Dispatch & Reporting
// ============================================================

message ExecuteTaskRequest {
    string task_id = 1;
    string torrent = 2;        // BT info-hash for P2P download
    ResourceSpec resource_limits = 3;
    string runtime = 4;
    string task_source = 5;
    string token = 6;          // nodepool-issued JWT for worker execution authorization
    int64 managed_budget_units = 7; // user-selected managed-function usage budget
    bytes general_compute_manifest_json = 8; // canonical general-compute-v1alpha1 request manifest
    string execution_id = 9; // immutable general-compute execution identity
    string attempt_id = 10; // immutable dispatch attempt identity
    string idempotency_key = 11; // Nodepool-owned result idempotency key
    string request_digest = 12; // canonical SHA-256 request digest
    string managed_dsl_backend_id = 13;
    string managed_dsl_semantics_manifest_sha256 = 14;
    reserved 15 to 17;
    bytes managed_gpu_manifest_json = 18; // canonical hcode-gpu request manifest
    string consensus_round_id = 19; // Nodepool-created managed consensus round
    string replica_id = 20; // Nodepool-created replica assignment identity
    uint32 consensus_protocol_version = 21;
}

message ManagedConsensusResult {
    uint32 protocol_version = 1;
    string status = 2;
    bytes output = 3;
    string error_code = 4;
    uint64 usage_units = 5;
    uint64 executed_ops = 6;
    uint64 output_bytes = 7;
    string runtime = 8;
    string backend_id = 9;
    string semantics_manifest_sha256 = 10;
    string source_sha256 = 11;
    string input_sha256 = 12;
    string result_digest = 13;
}

message ManagedConsensusSummary {
    uint32 protocol_version = 1;
    string state = 2;
    uint32 replica_count = 3;
    uint32 required_quorum = 4;
    uint32 votes_received = 5;
    uint32 matching_votes = 6;
    string result_digest = 7;
    string certificate_id = 8;
    string evidence_level = 9;
    string decided_at = 10;
    string mode = 11;
    string settlement_id = 12;
    bool settlement_authorized = 13;
}

message ExecuteTaskResponse {
    bool success = 1;
    string status_message = 2;
    int64 managed_executed_ops = 3;
    int64 managed_output_bytes = 4;
    string managed_receipt_json = 5;
    string execution_id = 7;
    string attempt_id = 8;
    string idempotency_key = 9;
    string request_digest = 10;
    bytes general_compute_result_json = 11; // validated general-compute-v1alpha1 result envelope
    bytes managed_gpu_result_json = 12; // validated hcode-gpu result envelope
    ManagedConsensusResult managed_consensus_result = 13;
    string managed_consensus_result_digest = 14;
    string replica_id = 15;
    string consensus_round_id = 16;
    uint32 consensus_protocol_version = 17;
    ExecutionObservation execution_observation = 18;
}

// Nodepool -> Worker: authenticated, attempt-bound general-compute artifact
// transfer. These messages intentionally carry the full identity and manifest
// binding; callers must not replace them with a raw bytes upload.
message GeneralComputeChunkUpload {
    string token = 1; // nodepool-issued worker execution token
    string execution_id = 2;
    string attempt_id = 3;
    string idempotency_key = 4;
    string request_digest = 5;
    string artifact_id = 6;
    int64 offset = 7;
    int64 size_bytes = 8;
    string sha256 = 9;
    bytes bytes = 10;
    int64 transfer_generation = 11; // Nodepool lease generation; must be positive
}

message GeneralComputeChunkResumeRequest {
    string token = 1; // nodepool-issued worker execution token
    string execution_id = 2;
    string attempt_id = 3;
    string idempotency_key = 4;
    string request_digest = 5;
    string artifact_id = 6;
    repeated string completed_sha256 = 7;
    int64 transfer_generation = 8; // Nodepool lease generation; must be positive
}

message GeneralComputeChunkUploadResponse {
    bool success = 1;
    string status_message = 2;
    int64 accepted_chunks = 3;
}

message GeneralComputeChunkDescriptor {
    int64 offset = 1;
    int64 size_bytes = 2;
    string sha256 = 3;
}

message GeneralComputeChunkResumeResponse {
    bool success = 1;
    string status_message = 2;
    repeated GeneralComputeChunkDescriptor missing_chunks = 3;
}

// User/Master -> Nodepool: authenticated, task-bound source artifact upload.
// This is intentionally separate from the Worker execution chunk service:
// Nodepool persists these bytes as the trusted source for later dispatch.
message GeneralComputeArtifactChunkUpload {
    string token = 1; // user JWT issued by Nodepool
    string task_id = 2;
    string artifact_id = 3;
    int64 offset = 4;
    int64 size_bytes = 5;
    string sha256 = 6;
    bytes bytes = 7;
}

message GeneralComputeArtifactChunkUploadResponse {
    bool success = 1;
    string status_message = 2;
    int64 accepted_chunks = 3;
}

// Worker -> Nodepool: only a live hcode replica may read its task's inputs.
message HcodeArtifactChunkDownload {
    string token = 1; // Nodepool-issued, attempt-bound execution token
    string task_id = 2;
    string artifact_id = 3;
    int64 offset = 4;
}

message HcodeArtifactChunkDownloadResponse {
    bytes bytes = 1; // bounded to 1 MiB; Worker verifies chunk and complete digests
}

// Nodepool reply for AuthorizeHcodeChunk: metadata-only authorization for one
// bounded chunk of a live hcode replica's task inputs. The request reuses
// HcodeArtifactChunkDownload, so the exact same live-assignment predicate
// authorizes both the metadata and the later byte download. The reply never
// carries bytes; the requester must still prove each downloaded chunk against
// these digests, and the authorization is not reusable offline.
message HcodeArtifactChunkAuthorization {
    string artifact_sha256 = 1; // immutable manifest identity for the whole artifact
    int64 artifact_size_bytes = 2;
    string chunk_sha256 = 3; // immutable manifest identity for the requested offset
    int64 chunk_size_bytes = 4;
}

// Owner -> Nodepool: register metadata for an already enrolled overlay peer.
// There is intentionally no caller-controlled IP, URL, port, TTL or key ID.
// Registration does not prove chunk availability or authorize any byte read.
message RegisterHcodeSourceRequest {
    string token = 1;
    string task_id = 2;
    string artifact_id = 3;
    string vpn_client_id = 4;
    uint64 headscale_node_id = 5;
}

message HcodeSourceRequest {
    string token = 1;
    string source_id = 2;
}

message HcodeSourceRegistration {
    string source_id = 1;
    string registration_id = 2; // changes on every renewal; fence future read leases
    string task_id = 3;
    string artifact_id = 4;
    string artifact_sha256 = 5;
    int64 artifact_size_bytes = 6;
    string overlay_ipv4 = 7; // observed through the trusted Headscale controller
    uint32 port = 8; // fixed overlay-only artifact service port
    int64 expires_at_unix_ms = 9;
    string state = 10; // registered_pending; never implies content readiness
}

message RevokeHcodeSourceResponse {
    bool revoked = 1;
}

// Owner -> Nodepool: resolve the owner's own enrolled node for one VPN client.
// Nodepool derives the enrollment key from its own record and confirms the node
// with the control plane. The reply is an identity hint for registration, not
// proof of availability.
message HcodeOwnerVpnNodeRequest {
    string token = 1;
    string vpn_client_id = 2;
}

message HcodeOwnerVpnNode {
    string vpn_client_id = 1;
    uint64 headscale_node_id = 2;
    string overlay_ipv4 = 3;
}

// Nodepool -> source -> Nodepool, using a distinct pre-dispatch capability.
message HcodePeerProbeRequest {
    string source_id = 1;
    string token = 2;
}

// A sampled chunk observation, not proof of permanent whole-file availability.
message HcodeSourceAvailability {
    HcodeSourceRegistration source = 1;
    int64 checked_at_unix_ms = 2;
    int64 available_until_unix_ms = 3;
    uint64 sampled_offset = 4;
}

message HcodeReadSources {
    repeated HcodeSourceAvailability sources = 1; // at most 8, for this assigned artifact
}

// Worker -> Nodepool only. Never forward chunk.token to the source peer.
// A known source may be tried only for an already-ready, active assignment;
// this is not source discovery or a pre-dispatch availability probe.
message IssueHcodeReadLeaseRequest {
    HcodeArtifactChunkDownload chunk = 1;
    string source_id = 2;
}

// Worker -> source and source -> Nodepool: purpose-separated read token only.
// No caller path, URL, range override or execution credential is accepted.
message HcodePeerReadRequest {
    string source_id = 1;
    string token = 2;
}

message HcodePeerReadAuthorization {
    string source_id = 1;
    string registration_id = 2;
    string task_id = 3;
    string artifact_id = 4;
    uint64 offset = 5;
    HcodeArtifactChunkAuthorization chunk = 6;
    int64 expires_at_unix_ms = 7;
}

message HcodeArtifactReadLease {
    string token = 1;
    string overlay_ipv4 = 2;
    uint32 port = 3;
    HcodePeerReadAuthorization authorization = 4;
}

// Nodepool -> Worker: authenticated admission/readiness for a
// general-compute attempt.  Chunk uploads must happen only after this
// request has established the assignment and immutable request identity.
message GeneralComputePrepareRequest {
    string task_id = 1;
    string token = 2; // nodepool-issued worker execution token
    string runtime = 3;
    bytes general_compute_manifest_json = 4;
    string execution_id = 5;
    string attempt_id = 6;
    string idempotency_key = 7;
    string request_digest = 8;
    int64 transfer_generation = 9; // Nodepool lease generation; must be positive
}

message GeneralComputePrepareResponse {
    bool success = 1;
    string status_message = 2;
    string execution_id = 3;
    string attempt_id = 4;
    string idempotency_key = 5;
    string request_digest = 6;
    int64 transfer_generation = 7;
}

message TaskOutputUploadRequest {
    string task_id = 1;
    string output = 2;
    string token = 3;
    string worker_id = 4;
    // The retry generation returned by PullBatch. Legacy callers that do not
    // provide it are accepted only for the initial assignment (generation 0).
    int32 retry_count = 5;
}
message TaskOutputUploadResponse {
    bool success = 1;
    string status_message = 2;
}

message TaskResultUploadRequest {
    string task_id = 1;
    string result_torrent = 2;
    string token = 3;
    string worker_id = 4;
    // The retry generation returned by PullBatch. Legacy callers that do not
    // provide it are accepted only for the initial assignment (generation 0).
    int32 retry_count = 5;
}
message TaskResultUploadResponse {
    bool success = 1;
    string status_message = 2;
}

message TaskOutputRequest {
    string task_id = 1;
    string token = 2;
}
message TaskOutputResponse {
    bool success = 1;
    string status_message = 2;
    string output = 3;
}

message StopTaskExecutionRequest {
    string task_id = 1;
    string token = 2;
    // Optional attempt identity for session-delivered cancellation. Legacy
    // direct callers may leave this empty and retain task-bound validation.
    string attempt_id = 3;
    string idempotency_key = 4;
}

message StopTaskExecutionResponse {
    bool success = 1;
    string status_message = 2;
}

message TaskUsageRequest {
    string task_id = 1;
    ResourceUsage usage = 2;
    string token = 3;
    string worker_id = 4;
    // The retry generation returned by PullBatch. Legacy callers that do not
    // provide it are accepted only for the initial assignment (generation 0).
    int32 retry_count = 5;
    ExecutionObservation execution_observation = 6;
    ResourceObservation resource_observation = 7;
    bool usage_received = 8;
}
message TaskUsageResponse {
    bool success = 1;
    string status_message = 2;
}

// ============================================================
// Batch Runtime (pull-based, future path)
// ============================================================

message DAGNode {
    string task_id = 1;
    repeated string artifact_inputs = 2;
    ResourceSpec resource_requirements = 3;
    int32 max_retries = 4;
    int64 deadline_unix = 5;
    bool deterministic = 6;
    bool side_effects = 7;
    int32 priority = 8;
    string execution_package_ref = 9;
}

message DAGEdge {
    string from_task_id = 1;
    string to_task_id = 2;
}

message DAGIR {
    string job_id = 1;
    repeated DAGNode nodes = 2;
    repeated DAGEdge edges = 3;
}

message ExecutionPackage {
    string runtime_version = 1;
    string task_code_ref = 2;
    repeated string artifact_refs = 3;
    map<string, string> constraints = 4;
}

message ArtifactChunk {
    string chunk_id = 1;
    string sha256 = 2;
    int64 offset = 3;
    int64 size = 4;
}

message ArtifactManifest {
    string artifact_id = 1;
    repeated ArtifactChunk chunks = 2;
    int64 size = 3;
    string compression = 4;
    string content_type = 5;
    string created_by_task = 6;
}

message CacheSummary {
    int64 cache_epoch = 1;
    bytes bloom_filter = 2;
    string partial_cache_digest = 3;
    int64 artifact_count = 4;
    int64 total_bytes = 5;
}

message PullBatchRequest {
    string worker_id = 1;
    int32 max_inflight_batches = 2;
    int32 available_memory_gb = 3;
    int32 queue_capacity = 4;
    CacheSummary cache_summary = 5;
    string token = 6;
}

message TaskLease {
    string task_id = 1;
    ExecutionPackage execution_package = 2;
    repeated ArtifactManifest artifacts = 3;
    ResourceSpec resource_limits = 4;
    int64 deadline_unix = 5;
    int32 priority = 6;
    // Echo this generation in every legacy report for this lease.
    int32 retry_count = 7;
}

message PullBatchResponse {
    bool success = 1;
    string status_message = 2;
    string batch_id = 3;
    repeated TaskLease tasks = 4;
}

message ExecutionMetrics {
    int64 cpu_time_ms = 1;
    int64 wall_time_ms = 2;
    int64 peak_memory_mb = 3;
    int64 download_bytes = 4;
    int64 cache_hits = 5;
    ExecutionObservation execution_observation = 6;
}

message CompletedTask {
    string task_id = 1;
    string status = 2;
    string stdout_artifact_ref = 3;
    string stderr_artifact_ref = 4;
    repeated string result_artifact_refs = 5;
    ExecutionMetrics metrics = 6;
    // The retry generation carried by the corresponding TaskLease.
    int32 retry_count = 7;
}

message CompleteBatchRequest {
    string worker_id = 1;
    string batch_id = 2;
    repeated CompletedTask tasks = 3;
    string token = 4;
}

message CompleteBatchResponse {
    bool success = 1;
    string status_message = 2;
}

message HeartbeatRequest {
    string worker_id = 1;
    string status = 2;
    int32 available_memory_gb = 3;
    int32 queue_capacity = 4;
    string token = 5;
    ResourceObservation resource_observation = 6;
    HardwareBenchmarkReport benchmark_report = 7;
}

message HeartbeatResponse {
    bool success = 1;
    string status_message = 2;
}


