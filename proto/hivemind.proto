// Dedicated transfer surface for general-compute artifacts. Its message cap
// is independent from the legacy/execute-task Worker RPC surface.
service GeneralComputeChunkService {
    rpc PrepareGeneralCompute(GeneralComputePrepareRequest) returns (GeneralComputePrepareResponse);
    rpc UploadChunk(GeneralComputeChunkUpload) returns (GeneralComputeChunkUploadResponse);
    rpc ResumeChunks(GeneralComputeChunkResumeRequest) returns (GeneralComputeChunkResumeResponse);
}

// Dedicated authenticated source-artifact persistence surface. Unlike the
// Worker chunk service, this service is served by Nodepool and writes only
// manifest-bound bytes owned by the task account.
service GeneralComputeArtifactService {
    rpc UploadChunk(GeneralComputeArtifactChunkUpload) returns (GeneralComputeArtifactChunkUploadResponse);
    rpc DownloadHcodeChunk(HcodeArtifactChunkDownload) returns (HcodeArtifactChunkDownloadResponse);
    rpc AuthorizeHcodeChunk(HcodeArtifactChunkDownload) returns (HcodeArtifactChunkAuthorization);
}

// Metadata-only owner control. No byte transfer or Worker discovery is enabled
// by registering a source; those require separate availability and live leases.
service HcodeArtifactSourceService {
    rpc RegisterSource(RegisterHcodeSourceRequest) returns (HcodeSourceRegistration);
    rpc GetSource(HcodeSourceRequest) returns (HcodeSourceRegistration);
    rpc RevokeSource(HcodeSourceRequest) returns (RevokeHcodeSourceResponse);
    rpc ResolveOwnerVpnNode(HcodeOwnerVpnNodeRequest) returns (HcodeOwnerVpnNode);
}

// Nodepool authority. ValidateReadLease rechecks persisted live state for every
// source read; a valid signature or an earlier successful validation is not enough.
service HcodeArtifactReadLeaseService {
    rpc IssueReadLease(IssueHcodeReadLeaseRequest) returns (HcodeArtifactReadLease);
    rpc ValidateReadLease(HcodePeerReadRequest) returns (HcodePeerReadAuthorization);
    rpc ListReadSources(HcodeArtifactChunkDownload) returns (HcodeReadSources);
}

// Owner-triggered, bounded availability sampling. No caller-chosen endpoint or
// execution identity. Validation always checks the current persisted probe.
service HcodeArtifactProbeService {
    rpc ProbeSource(HcodeSourceRequest) returns (HcodeSourceAvailability);
    rpc ValidateProbeLease(HcodePeerProbeRequest) returns (HcodePeerReadAuthorization);
}

// Overlay data plane hosted by the file owner. Execution bytes go directly to
// Workers; Nodepool may sample one bounded manifest chunk to check availability.
service HcodeArtifactPeerService {
    rpc ReadChunk(HcodePeerReadRequest) returns (HcodeArtifactChunkDownloadResponse);
    rpc ProbeChunk(HcodePeerProbeRequest) returns (HcodeArtifactChunkDownloadResponse);
}

service BatchRuntimeService {
    rpc PullBatch(PullBatchRequest) returns (PullBatchResponse);
    rpc CompleteBatch(CompleteBatchRequest) returns (CompleteBatchResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}
