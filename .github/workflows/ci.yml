name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hivemind-rs

      - name: Check formatting
        working-directory: hivemind-rs
        run: cargo fmt --all -- --check

      - name: Clippy lints
        working-directory: hivemind-rs
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        working-directory: hivemind-rs
        run: cargo test --workspace -- --nocapture

      - name: Check binary crate
        working-directory: hivemind-rs
        run: cargo check -p hivemind-bin

  frontend:
    name: Frontend Builds
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend/master-ui
          - frontend/worker-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.app }}
        run: npm test

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  official-site:
    name: Official Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run contract tests
        working-directory: frontend
        run: node --test site-contract.test.mjs

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_SECRET: ci-jwt-secret-at-least-32-bytes
          WORKER_EXECUTION_PRIVATE_KEY_PEM: ci-worker-execution-private-key-placeholder
          WORKER_NODEPOOL_TOKEN: ci-worker-nodepool-token-placeholder
        run: docker compose config
